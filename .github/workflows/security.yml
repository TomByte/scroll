# Checks the dependencies in Cargo.lock against the RustSec advisory database: on every change
# to them, and weekly, since advisories appear for versions already in use.
name: Security audit

on:
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", ".github/workflows/security.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit
