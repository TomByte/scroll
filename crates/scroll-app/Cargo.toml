[package]
name = "scroll-app"
version.workspace = true
edition.workspace = true

[[bin]]
# Capitalised: without an app bundle, macOS shows the binary's name in the Dock and the menu bar.
name = "Scroll"
path = "src/main.rs"

[dependencies]
scroll-core.workspace = true
gpui.workspace = true
scroll-ui.workspace = true
scroll-table.workspace = true
scroll-sync.workspace = true
scroll-settings.workspace = true
scroll-mcp.workspace = true
loro.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
security-framework.workspace = true
objc.workspace = true
syntect.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
scroll-core = { workspace = true, features = ["fixture"] }
