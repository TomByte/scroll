# Advisories `cargo audit` reports that do not apply to how Scroll uses the crate. Each needs
# a reason; remove an entry once the crate can be upgraded past it.
[advisories]
ignore = [
    # rsa: timing side channel in private-key operations (no fixed 0.9 release). It comes in
    # through jsonwebtoken, which the server uses only to verify Google's sign-in tokens with
    # Google's public keys; the server holds no RSA private key. Only test helpers sign.
    "RUSTSEC-2023-0071",
    # crypto-bigint: operations meant to be constant-time are not. It comes in through
    # jsonwebtoken's elliptic-curve support (fixed only in 0.7, which that stack cannot use
    # yet); the server verifies RS256 tokens and has no elliptic-curve secret to leak.
    "RUSTSEC-2026-0387",
]
