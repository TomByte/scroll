[workspace]
resolver = "3"
members = ["crates/scroll-core", "crates/scroll-ui", "crates/scroll-app", "crates/scroll-server", "crates/scroll-table", "crates/scroll-sync", "crates/scroll-api"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
scroll-core = { path = "crates/scroll-core" }
scroll-api = { path = "crates/scroll-api" }
scroll-ui = { path = "crates/scroll-ui" }
loro = "1.17"
rusqlite = { version = "0.41", features = ["bundled", "uuid", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
gpui = "0.2.2"
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
deadpool-postgres = "0.14"
argon2 = "0.6"
sha2 = "0.11"
getrandom = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
serde_json = "1"
serde_urlencoded = "0.7"
unicode-segmentation = "1.13"
log = "0.4"
libc = "0.2"
scroll-table = { path = "crates/scroll-table" }
scroll-sync = { path = "crates/scroll-sync" }
security-framework = "3"
native-tls = "0.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14"
time = "0.3"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
base64 = "0.22"
